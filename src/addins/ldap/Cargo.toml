[package]
name = "opi_ldap"
version = "2.4.0"
license = "MIT"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
opt-level = "z"

[dependencies]
common-backend = { path = "../commons/common-backend" }
common-core = { path = "../commons/common-core" }
common-logs = { path = "../commons/common-logs" }
common-utils = { path = "../commons/common-utils" }
common-janx = { path = "../commons/common-janx" }
common-tcp = { path = "../commons/common-tcp" }

ldap3 = { version = "0.11", default-features = false, features = ["sync", "tls-native"] }
serde_json = "1.0"
